name: BountySMP
version: 1.0.0
main: com.bountysmp.BountySMP
api-version: 1.21
author: BountySMP
description: Plugin de chasse aux primes pour SMP vanilla (Bounty Coins, boutique, tracker).

commands:
  bounty:
    description: Commande principale du système de primes (ouvre le menu si sans argument).
    usage: /bounty [add|addcoins|removecoins|addadmin|reset] ...

permissions:
  bountysmp.admin:
    description: Permet d'utiliser les commandes admin du plugin.
    default: op
  bountysmp.use:
    description: Permet d'utiliser les commandes joueur du plugin.
    default: true
