# ================================
#   Configuration - Bounty SMP
# ================================

# Récompense de base pour un kill "normal" (joueur sans prime)
kill-reward: 5

# Anti-farm : si tu tues LE MEME joueur plusieurs fois avant ce délai (en secondes),
# la récompense est fortement réduite pour éviter le farm entre amis.
anti-farm:
  cooldown-seconds: 600
  reduced-reward: 1

# Système de danger automatique : plus un joueur enchaine les kills dans une fenêtre
# de temps donnée, plus sa prime augmente automatiquement.
danger:
  window-seconds: 600
  # Nombre de kills (dans la fenêtre) -> bonus de prime ajouté (une seule fois par palier)
  thresholds:
    1: 10
    3: 50
    5: 100
    10: 250

# Prix de la boutique /bounty shop
shop:
  tracker-price: 30
  iron-kit-price: 70
  diamond-kit-price: 220
  netherite-kit-price: 800
  smoke-bomb-price: 45
  chaos-grenade-price: 70
  dash-item-price: 60
  rage-vial-price: 50
  fake-ingot-price: 35
  stink-bomb-price: 40
  lucky-purse-price: 50
  spy-eye-price: 40
  pickpocket-price: 70
  survival-kit-price: 15
  travel-rations-price: 10
  torch-bag-price: 8
  first-aid-price: 20

# Cooldowns des objets (façon perle d'ender), en secondes - raccourcis pour plus de dynamisme
item-cooldowns:
  smoke-bomb-seconds: 12
  dash-item-seconds: 10
  chaos-grenade-seconds: 10
  rage-vial-seconds: 12
  stink-bomb-seconds: 10
  spy-eye-seconds: 10

# Échange de minerais contre des Bounty Coins (taux volontairement défavorable)
ore-exchange:
  diamond-rate: 5
  emerald-rate: 2
  netherite-ingot-rate: 30
  daily-limit: 3

# Objet Tracker : cooldown (façon perle d'ender) et imprécision des coordonnées
tracker:
  cooldown-seconds: 15
  imprecision-blocks: 40

# Fumigène du Fugitif : rayon (en blocs) dans lequel les joueurs proches sont aveuglés
smoke-bomb:
  blind-radius: 6.0

# Élan du Chasseur : force de la propulsion
dash-item:
  strength: 2.2

# Œil de Judas : imprécision de la distance annoncée (en %)
spy-eye:
  imprecision-percent: 20

# Bourse Trouée : montant volé et portée maximale (en blocs)
pickpocket:
  steal-amount: 15
  max-range: 10.0

# Bourse Chanceuse : gain minimum et jackpot (en coins)
lucky-purse:
  min-reward: 0
  jackpot-reward: 300
